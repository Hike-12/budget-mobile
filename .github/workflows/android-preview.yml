name: Android preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUDGET_ANDROID_PREVIEW: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npx expo lint -- --max-warnings 0
      - run: npx expo prebuild --platform android --no-install
      - name: Build the ARM64 preview APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: budget-mobile-preview-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
